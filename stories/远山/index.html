<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loreline</title>
<script>
  // Apply saved theme before CSS paints (prevents flash of wrong theme)
  (function () {
    var saved = localStorage.getItem('loreline-theme');
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="icon" href="src/favicon.ico">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="topbar-brand">
      <img class="topbar-icon" src="src/favicon.ico" alt="" aria-hidden="true" width="24" height="24">
      
    </div>
    <div class="topbar-title" id="story-title">Loreline</div>
  </div>
  <nav class="topbar-menu">
    <button id="btn-synopsis" class="topbar-btn" title="查看剧情介绍">🐎剧情</button>
    <button id="btn-about" class="topbar-btn" title="关于本作">🔨关于</button>
    <span class="topbar-sep" aria-hidden="true"></span>
    <button id="btn-theme" class="topbar-btn" title="切换主题">🌙主题</button>
    <button id="btn-restart" class="topbar-btn" title="重新开始故事"> 🌏重启</button>
  </nav>
</header>

<div id="output"></div>

<footer class="footer">
  <div class="footer-meta" id="footer-meta"></div>
</footer>

<!-- Reusable modal dialog: 登场人物 / 剧情介绍 / 关于 (content from setting.js) -->
<div class="modal-overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Scripts: setting.js (classic, sets window.STORY_SETTINGS) → app.js (module, imports loreline.js) -->
<script src="src/setting.js"></script>
<script type="module" src="src/app.js"></script>

</body>
</html>
