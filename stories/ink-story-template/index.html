<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title class="title"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 添加到主屏幕后以独立 Web App 全屏启动（iOS 无地址栏/工具栏） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 让 iOS 状态栏/浏览器顶栏跟随明暗主题 -->
    <meta name="theme-color" content="#e5e5e5" />
    <link rel="icon" href="assets/favicon.ico" />
    <!-- Prevent dark mode flash - must be before CSS -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ink-template-settings");
          var settings = stored ? JSON.parse(stored) : null;
          var theme = settings && settings.theme ? settings.theme : "auto";
          var isDark =
            theme === "dark" ||
            (theme === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="css/template.min.css" />
    <link rel="stylesheet" href="css/custom.css" />
  </head>

  <body>
    <!-- Loading screen - hidden after story initializes -->
    <div id="loading-screen" class="loading-screen" aria-live="polite">
      <div class="loading-content">
        <div class="loading-spinner" aria-label="加载故事中"></div>
      </div>
    </div>
    <a href="#story" class="skip-link">跳转到故事内容</a>
    <!-- Top navigation bar -->
    <nav class="top-nav" aria-label="故事">
      <div class="nav-title-section">
        <div class="nav-title-wrapper">
          <h1 class="nav-title title"></h1>
          <button
            type="button"
            id="title-restart"
            class="nav-title-btn"
            aria-hidden="true"
            tabindex="-1"
          ></button>
        </div>
        <span class="nav-byline byline"></span>
      </div>
      <div class="nav-controls">
        <button
          id="home-btn"
          type="button"
          aria-label="返回主页"
        >
          <span class="material-icons-outlined nav-icon" aria-hidden="true"
            >home</span
          >
        </button>
        <button
          id="rewind"
          type="button"
          aria-label="重新开始故事"
          aria-keyshortcuts="Control+r"
        >
          <span class="material-icons-outlined nav-icon" aria-hidden="true"
            >replay</span
          >
        </button>
        <button
          id="saves-btn"
          type="button"
          aria-label="存档"
          aria-keyshortcuts="Control+s"
        >
          <span class="material-icons-outlined nav-icon" aria-hidden="true"
            >bookmark</span
          >
        </button>
        <button
          id="settings-btn"
          type="button"
          aria-label="设置"
          aria-keyshortcuts="Control+,"
        >
          <span class="material-icons-outlined nav-icon" aria-hidden="true"
            >settings</span
          >
        </button>
        <button
          id="reader-btn"
          type="button"
          aria-label="全屏阅读"
          aria-pressed="false"
        >
          <span class="material-icons-outlined nav-icon" aria-hidden="true"
            >fullscreen</span
          >
        </button>
      </div>
    </nav>
    <main class="outerContainer" id="main-content" aria-busy="true">
      <!-- Story container -->
      <div
        id="story"
        role="region"
        aria-label="故事内容"
        class="container"
        tabindex="-1"
      ></div>
    </main>

    <script src="js/template.min.js" defer></script>
    <script src="js/custom.js" defer></script>
  </body>
</html>
